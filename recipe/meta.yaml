{% set python_min = "3.10" %}
{% set name = "glue-plotly" %}
{% set version = "0.13.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 7b092533ba5a0edcbb24c500cb4a54ad8a006d4b324688c1571ea98ad61a5edf

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >={{ python_min }}
    - glue-core >=1.13.1
    - plotly <6.0.0a0
    - chart-studio

test:
  imports:
    - glue_plotly
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/glue-viz/glue-plotly
  summary: Experimental plot.ly exporters for glue
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - astrofrog
